name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

  container-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with random secrets
        run: ./scripts/bootstrap.sh

      - name: Build Spark and loader images
        run: docker compose --profile spark --profile tools build spark loader

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Spark tests
        run: docker compose run --rm spark python -m pytest tests/spark -q -p no:cacheprovider

      - name: Warehouse tests
        run: docker compose run --rm loader python -m pytest tests/warehouse -q -p no:cacheprovider

  dbt-parse:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with random secrets
        run: ./scripts/bootstrap.sh

      - name: Build dbt image
        run: docker compose --profile spark --profile tools --profile airflow build dbt

      - name: Validate dbt project
        run: |
          mkdir -p dbt/logs dbt/target
          chmod -R a+rwX dbt
          docker compose run --rm dbt dbt --debug parse

  dag-import:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      HOST_PROJECT_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with random secrets
        run: ./scripts/bootstrap.sh

      - name: Build Airflow image
        run: docker compose --profile airflow build airflow-init

      - name: Check that all DAGs import
        run: |
          docker compose --profile airflow run --rm --no-deps --entrypoint "" \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False airflow-scheduler \
            python -c "
          from airflow.dag_processing.dagbag import DagBag
          bag = DagBag(dag_folder='/opt/airflow/dags')
          print('DAGs found:', sorted(bag.dag_ids))
          print('Import errors:', bag.import_errors)
          raise SystemExit(1 if bag.import_errors else 0)
          "
