services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: taxi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"   # S3 API (our Python code talks to this)
      - "9001:9001"   # web console (you open this in a browser)
    volumes:
      - minio_data:/data
    restart: unless-stopped

  spark:
    build: ./docker/spark
    image: taxi-spark:local
    working_dir: /app
    mem_limit: 4g
    environment:
      HOME: /tmp
    volumes:
      - ./spark:/app/spark
      - ./tests:/app/tests
      - ./data:/app/data
    profiles: ["spark"]

  postgres:
    image: postgres:17-alpine
    container_name: taxi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  loader:
    build: ./docker/loader
    image: taxi-loader:local
    working_dir: /app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATA_DIR: /app/data
    volumes:
      - ./warehouse:/app/warehouse
      - ./tests:/app/tests
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  minio_data:
  pg_data:
